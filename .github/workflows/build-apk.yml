name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Add Android native project
        run: npx cap add android
      - name: Sync web assets into Android project
        run: npx cap sync android
      - name: Register AdMob App ID in Android manifest
        run: |
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2648920635925261~2543032690"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crystal-caverns-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
