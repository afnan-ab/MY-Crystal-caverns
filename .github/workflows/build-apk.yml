name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Add Android native project
        run: npx cap add android
      - name: Add Firebase Analytics
        run: |
          cp google-services.json android/app/google-services.json
          sed -i "s#classpath 'com.android.tools.build:gradle:[^']*'#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          sed -i "1s#^#apply plugin: 'com.google.gms.google-services'\n#" android/app/build.gradle
          sed -i "0,/dependencies {/{s#dependencies {#dependencies {\n    implementation platform('com.google.firebase:firebase-bom:34.17.0')\n    implementation 'com.google.firebase:firebase-analytics'#}" android/app/build.gradle
      - name: Sync web assets into Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crystal-caverns-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
